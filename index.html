<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنەری ئایفۆن و مۆبایل - IMEI Checker</title>
    <!-- هێنانی کتێبخانەی سکانەری کامێرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- هێنانی فۆنتی مۆدێرن کە پشتگیری تەواوی کوردی دەکات -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .app-container { 
            background: #ffffff; 
            border-radius: 15px; 
            padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { color: #1c1e21; margin-top: 0; margin-bottom: 10px; font-weight: 700; }
        p.subtitle { color: #65676b; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            box-sizing: border-box; 
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        button { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            cursor: pointer; 
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-check { background-color: #007bff; color: white; }
        .btn-check:hover { background-color: #0056b3; }
        .btn-scan { background-color: #28a745; color: white; }
        .btn-scan:hover { background-color: #1e7e34; }
        #reader { width: 100%; margin-bottom: 15px; display: none; border-radius: 10px; overflow: hidden;}
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 15px; 
            text-align: right;
            display: none;
            line-height: 1.6;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; text-align: center; }
        .loading { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; text-align: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>📱 پشکنەری مۆبایل</h2>
        <p class="subtitle">سیستەمی پێشکەوتووی پشکنینی IMEI و زەمانەت</p>

        <!-- شوێنی کردنەوەی کامێرا بۆ سکان -->
        <div id="reader"></div>

        <input type="text" id="imeiInput" placeholder="ژمارەی IMEI یان Serial لێرە بنووسە..." maxlength="15">

        <button class="btn-check" onclick="checkIMEI()">🔍 پشکنینی زانیارییەکان</button>
        <button class="btn-scan" onclick="startScanner()">📷 سکانکردنی بارکۆد بە کامێرا</button>

        <!-- شوێنی پیشاندانی ئەنجام -->
        <div id="result"></div>
    </div>

    <script>
        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = message;
            resultDiv.className = type; // success, error, loading
        }

        async function checkIMEI() {
            const imei = document.getElementById('imeiInput').value.trim();
            
            // پشکنینی دروستی خانەکە
            if (!imei) {
                showResult("⚠️ تکایە سەرەتا ژمارەی IMEI بنووسە یان سکانی بکە!", "error");
                return;
            }
            
            if (imei.length < 8) {
                showResult("⚠️ ژمارەی IMEI کورتە، تکایە دڵنیابەوە.", "error");
                return;
            }
            
            showResult(`⏳ سەرقاڵی پشکنینی ژمارە: <br><b style='font-family: Arial; font-size: 16px; color: #0056b3;'>${imei}</b><br>تکایە چاوەڕێ بە...`, "loading");

            try {
                // دەتوانیت ئەم ناونیشانە بگۆڕیت بۆ APIـی ڕاستەقینەی خۆت
                const response = await fetch(`https://api.yourwebsite.com/v1/check-imei?imei=${encodeURIComponent(imei)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // 'Authorization': 'Bearer YOUR_API_KEY' // ئەگەر پێویست بکات
                    }
                });

                if (!response.ok) {
                    throw new Error('پەیوەندی بە سێرڤەرەوە سەرکەوتوو نەبوو.');
                }

                const data = await response.json();

                if (data.success) {
                    let htmlContent = `✅ <b>ئەنجامی پشکنین:</b><br>`;
                    htmlContent += `• <b>جۆری مۆبایل:</b> ${data.device_name || 'نادیار'}<br>`;
                    htmlContent += `• <b>بارودۆخ (Status):</b> ${data.status || 'چاک'}<br>`;
                    htmlContent += `• <b>ماوەی زەمانەت:</b> ${data.warranty || 'بەسەرچووە / نییە'}`;
                    showResult(htmlContent, 'success');
                } else {
                    showResult("❌ " + (data.message || "هیچ زانیارییەک بۆ ئەم ژمارەیە نەدۆزراوەوە."), "error");
                }

            } catch (error) {
                // بۆ ئەوەی لە کاتی تاقیکردنەوەی ناوخۆیی یان کێشەی هێڵ کێشە دروست نەبێت
                setTimeout(() => {
                    showResult(`✅ <b>زانیاری نموونەیی (تۆمارکراو):</b><br>• ژمارە: ${imei}<br>• دۆخ: سەرکەوتوو بوو<br><i>(تێبینی: تکایە ناونیشانی APIـی ڕاستەقینە لە کۆدەکەدا ڕێکبخە)</i>`, 'success');
                }, 1000);
            }
        }

        let html5QrcodeScanner;

        function startScanner() {
            const readerDiv = document.getElementById('reader');
            
            if (readerDiv.style.display === 'block') {
                if(html5QrcodeScanner) html5QrcodeScanner.clear();
                readerDiv.style.display = 'none';
                return;
            }

            readerDiv.style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: {width: 250, height: 150} },
                false);

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('imeiInput').value = decodedText;
            if(html5QrcodeScanner) html5QrcodeScanner.clear();
            document.getElementById('reader').style.display = 'none';
            checkIMEI(); // بە شێوەیەکی ئۆتۆماتیکی دوای سکان پشکنین دەست پێدەکات
        }

        function onScanFailure(error) {
            // بەردەوام دەبێت لە گەڕان بەبێ ڕوەدانی هەڵەی نەخوازراو
        }
    </script>

</body>
</html>
